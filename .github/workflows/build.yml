
name: Build UltraSmooth

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project ZIP
        run: |
          unzip -o UltraSmooth-1.21.11-starter.zip -d /tmp/us
          cp -r /tmp/us/UltraSmooth-1.21.11/. .

      - name: Build mod
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UltraSmooth-1.21.11
          path: build/libs/*.jar
